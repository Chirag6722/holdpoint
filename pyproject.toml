[project]
name = "holdpoint"
version = "0.1.0"
description = "A commit gate for MCP tools: irreversible calls do not run until they pass review."
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = ["fastmcp==4.1.6", "PyYAML>=6"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6", "z3-solver>=4.13"]
prove = ["z3-solver>=4.13"]

[project.scripts]
holdpoint = "holdpoint.cli:main"
holdpoint-proxy = "holdpoint.proxy:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["holdpoint"]

[tool.ruff]
line-length = 110

[tool.pytest.ini_options]
testpaths = ["tests"]
